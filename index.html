<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kotecha Family Heritage</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Georgia, serif;
    background: #f5f3e9;
    text-align: center;
}

header {
    background-color: #174d32;
    color: white;
    padding: 25px 10px;
}

header h1 {
    font-size: 40px;
    font-weight: bold;
}

.tree-section {
    width: 100%;
    margin: 0;
    padding: 0;
    background-color: #e8efdf;
}

.tree-section img {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
    padding: 0;
}

.welcome {
    padding: 30px 10px;
    color: #174d32;
}

.welcome h2 {
    font-size: 32px;
    font-weight: bold;
}

@media (max-width: 600px) {

    header {
        padding: 20px 8px;
    }

    header h1 {
        font-size: 29px;
    }

    .welcome {
        padding: 25px 10px;
    }

    .welcome h2 {
        font-size: 24px;
    }
}

</style>
</head>

<body>

<header>
    <h1>Kotecha Family Heritage</h1>
</header>

<section class="tree-section">
    <img src="banyan_tree_new.jpeg"
         alt="Kotecha Family Heritage Banyan Tree">
</section>

<section class="welcome">
    <h2>Welcome to Kotecha Family Heritage</h2>
</section>

</body>
</html>
