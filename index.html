<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kotecha Family Heritage</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Georgia, serif;
    background-color: #f5f1e8;
    text-align: center;
}

header {
    padding: 25px 15px;
    background-color: #174d32;
    color: white;
}

header h1 {
    font-size: 38px;
    margin-bottom: 12px;
}

.tagline {
    font-size: 21px;
    font-style: italic;
    letter-spacing: 1px;
}

.tree-container {
    width: 100%;
    padding: 20px 10px;
    background-color: #e8f0df;
}

.tree-container img {
    width: 100%;
    max-width: 1100px;
    height: 520px;
    object-fit: contain;
    display: block;
    margin: auto;
}

.welcome {
    padding: 35px 15px;
    color: #174d32;
}

.welcome h2 {
    font-size: 32px;
}

@media (max-width: 600px) {

    header h1 {
        font-size: 28px;
    }

    .tagline {
        font-size: 16px;
    }

    .tree-container img {
        height: 350px;
    }

    .welcome h2 {
        font-size: 24px;
    }
}

</style>
</head>

<body>

<header>

    <h1>Kotecha Family Heritage</h1>

    <p class="tagline">
        Preserving Our Past, Connecting Our future
    </p>

</header>

<section class="tree-container">

    <img src="banyan_tree_new.jpeg"
         alt="Beautiful Banyan Tree">

</section>

<section class="welcome">

    <h2>Welcome to kotecha family heritage</h2>

</section>

</body>
</html>
