<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Our Family Heritage</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    background: #173b25;
}

.banner {
    width: 100%;
    text-align: center;
}

.banner img {
    display: block;
    width: 100%;
    height: auto;
    max-width: 100%;
    margin: 0 auto;
}

@media (min-width: 1600px) {
    .banner img {
        max-width: 1600px;
    }
}

</style>

</head>

<body>

<div class="banner">

    <img
    src="banyan_tree_new.jpeg"
    alt="Our Family Heritage - Preserving Our Past, Connecting Our Future">

</div>

</body>

</html>
